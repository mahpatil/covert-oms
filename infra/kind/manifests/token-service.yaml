apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-service
  namespace: covert-oms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: token-service
  template:
    metadata:
      labels:
        app: token-service
    spec:
      containers:
        - name: token-service
          image: covert-oms-token-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: token-service
  namespace: covert-oms
spec:
  selector:
    app: token-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30004
  type: NodePort
