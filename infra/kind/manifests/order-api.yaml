apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: covert-oms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
        - name: order-api
          image: covert-oms-order-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PrintCoordinatorUrl
              value: "http://print-coordinator:8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: covert-oms
spec:
  selector:
    app: order-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30001
  type: NodePort
