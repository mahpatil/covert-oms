events {
    worker_connections 1024;
}

http {
    client_max_body_size 50m;

    upstream order_api {
        server order-api:8080;
    }

    upstream token_service {
        server token-service:8080;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;

        # Auth routes proxy to token-service
        location /connect/ {
            proxy_pass http://token_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API routes proxy to order-api
        location /api/ {
            proxy_pass http://order_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check passthrough
        location /health {
            proxy_pass http://order_api;
        }

        # Everything else goes to the React frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}
