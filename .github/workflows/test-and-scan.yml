name: Test and Scan

on:
  pull_request:
    branches: [main]

jobs:
  dotnet-tests:
    name: .NET Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CovertOms.sln

      - name: Build
        run: dotnet build CovertOms.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CovertOms.sln --no-build --configuration Release --logger trx --results-directory TestResults/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults/

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose -f infra/docker-compose.yml build

      - name: Scan order-api
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'covert-oms-order-api:latest'
          format: 'sarif'
          output: 'trivy-order-api.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Scan print-coordinator
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'covert-oms-print-coordinator:latest'
          format: 'sarif'
          output: 'trivy-print-coordinator.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Scan branch-agent
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'covert-oms-branch-agent:latest'
          format: 'sarif'
          output: 'trivy-branch-agent.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: '.'
          category: trivy

  codeql-scan:
    name: CodeQL Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp, javascript

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build for CodeQL
        run: dotnet build CovertOms.sln

      - name: Analyze
        uses: github/codeql-action/analyze@v3
