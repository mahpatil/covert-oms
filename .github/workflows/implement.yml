name: Implement

on:
  push:
    branches: [main]
    paths:
      - 'changes/**/tasks.md'

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed tasks.md
        id: spec
        run: |
          TASKS_FILE=$(git diff HEAD^1 HEAD --name-only | grep 'changes/.*/tasks.md' | head -1)
          if [ -z "$TASKS_FILE" ]; then
            echo "No tasks.md change detected, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tasks_file=$TASKS_FILE" >> "$GITHUB_OUTPUT"
          SLUG=$(echo "$TASKS_FILE" | cut -d'/' -f2)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        if: steps.spec.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        if: steps.spec.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AI CLI
        if: steps.spec.outputs.skip != 'true'
        id: cli
        uses: ./.github/actions/install-ai-cli
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: Create implementation branch
        if: steps.spec.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "feat/implement-${{ steps.spec.outputs.slug }}"

      - name: Run coder skill
        if: steps.spec.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          ${{ steps.cli.outputs.cmd }} "/coder ${{ steps.spec.outputs.tasks_file }}" || true

      - name: Commit implementation
        if: steps.spec.outputs.skip != 'true'
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "feat: implement ${{ steps.spec.outputs.slug }}"
          git push origin "feat/implement-${{ steps.spec.outputs.slug }}"

      - name: Open implementation PR
        if: steps.spec.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "feat: ${{ steps.spec.outputs.slug }}" \
            --body "$(cat <<'EOF'
          ## Implementation

          Implements the approved proposal for `${{ steps.spec.outputs.slug }}`.

          **Proposal:** `changes/${{ steps.spec.outputs.slug }}/proposal.md`
          **Tasks:** `changes/${{ steps.spec.outputs.slug }}/tasks.md`

          _Generated by the implement workflow using `${{ vars.AI_CLI || 'claude' }}` CLI._
          EOF
          )" \
            --base main \
            --head "feat/implement-${{ steps.spec.outputs.slug }}"
