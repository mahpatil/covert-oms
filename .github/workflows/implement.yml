name: Implement

on:
  push:
    branches: [main]
    paths:
      - 'changes/**/tasks.md'  
jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      issues: read

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect changed tasks.md
        id: spec
        run: |
          python .github/scripts/harness.py --mode implement-detect --issue-title "noop" --issue-number 0

      - name: Setup .NET
        if: steps.spec.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create implementation branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.spec.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git checkout -b "feat/implement-${{ steps.spec.outputs.slug }}"

      - name: Setup Node
        if: steps.spec.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AI CLI
        if: steps.spec.outputs.skip != 'true'
        uses: ./.github/actions/install-ai-cli
        with:
          ai_cli: ${{ vars.AI_CLI || 'claude' }}

      - name: Implement via harness
        if: steps.spec.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/harness.py --mode implement-run --provider "${{ vars.AI_CLI || 'claude' }}" --issue-title "noop"  --issue-number 0 --slug "${{ steps.spec.outputs.slug }}" --tasks-file "${{ steps.spec.outputs.tasks_file }}"

      # ── Commit and open PR (always) ────────────────────────────────────────
      - name: Commit implementation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.spec.outputs.skip != 'true'
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "feat: implement ${{ steps.spec.outputs.slug }}"
          git push origin "feat/implement-${{ steps.spec.outputs.slug }}"

      - name: Open implementation PR
        if: steps.spec.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "feat: ${{ steps.spec.outputs.slug }}" \
            --body "$(cat <<'EOF'
          ## Implementation

          Implements the approved proposal for `${{ steps.spec.outputs.slug }}`.

          **Proposal:** `changes/${{ steps.spec.outputs.slug }}/proposal.md`
          **Tasks:** `${{ steps.spec.outputs.tasks_file }}`

          _Generated using `${{ vars.AI_CLI || 'claude' }}` via the opsx pipeline._
          EOF
          )" \
            --base main \
            --head "feat/implement-${{ steps.spec.outputs.slug }}"