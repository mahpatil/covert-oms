name: Implement

on:
  push:
    branches: [main]
    paths:
      - 'changes/**/tasks.md'  
jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      issues: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed tasks.md
        id: spec
        run: |
          TASKS_FILE=$(git diff HEAD^1 HEAD --name-only | grep 'changes/.*/tasks.md' | head -1)
          if [ -z "$TASKS_FILE" ]; then
            echo "No tasks.md change detected, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tasks_file=$TASKS_FILE" >> "$GITHUB_OUTPUT"
          SLUG=$(echo "$TASKS_FILE" | cut -d'/' -f2)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        if: steps.spec.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create implementation branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.spec.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "feat/implement-${{ steps.spec.outputs.slug }}"

      # ── Claude path: use the official claude-code-action ──────────────────
      - name: Implement (Claude)
        if: steps.spec.outputs.skip != 'true' && (vars.AI_CLI == '' || vars.AI_CLI == 'claude')
        uses: anthropics/claude-code-action@v1
        with:
#          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are running in an automated GitHub Actions workflow.

            Please implement the feature described in the approved proposal and task list.

            Proposal: `changes/${{ steps.spec.outputs.slug }}/proposal.md`
            Tasks: `${{ steps.spec.outputs.tasks_file }}`

            Run: /coder ${{ steps.spec.outputs.tasks_file }}

            Follow test-driven development (red-green-refactor). Write tests first,
            then implement. Use the existing patterns in this codebase:
            - .NET 8 ASP.NET Core for backend services
            - xUnit + FluentAssertions for .NET tests
            - React + TypeScript + Vitest for frontend

      # ── Codex / OpenCode path: manual CLI install ─────────────────────────
      - name: Setup Node (Codex/OpenCode)
        if: steps.spec.outputs.skip != 'true' && vars.AI_CLI != '' && vars.AI_CLI != 'claude'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AI CLI (Codex/OpenCode)
        if: steps.spec.outputs.skip != 'true' && vars.AI_CLI != '' && vars.AI_CLI != 'claude'
        id: cli
        uses: ./.github/actions/install-ai-cli

      - name: Implement (Codex/OpenCode)
        if: steps.spec.outputs.skip != 'true' && vars.AI_CLI != '' && vars.AI_CLI != 'claude'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          ${{ steps.cli.outputs.cmd }} "/coder ${{ steps.spec.outputs.tasks_file }}" || true

      # ── Commit and open PR (always) ────────────────────────────────────────
      - name: Commit implementation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.spec.outputs.skip != 'true'
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "feat: implement ${{ steps.spec.outputs.slug }}"
          git push origin "feat/implement-${{ steps.spec.outputs.slug }}"

      - name: Open implementation PR
        if: steps.spec.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "feat: ${{ steps.spec.outputs.slug }}" \
            --body "$(cat <<'EOF'
          ## Implementation

          Implements the approved proposal for `${{ steps.spec.outputs.slug }}`.

          **Proposal:** `changes/${{ steps.spec.outputs.slug }}/proposal.md`
          **Tasks:** `${{ steps.spec.outputs.tasks_file }}`

          _Generated using `${{ vars.AI_CLI || 'claude' }}` via the opsx pipeline._
          EOF
          )" \
            --base main \
            --head "feat/implement-${{ steps.spec.outputs.slug }}"
