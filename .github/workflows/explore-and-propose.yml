name: Explore and Propose

on:
  issues:
    types: [labeled]

jobs:
  generate-proposal:
    if: github.event.label.name == 'feature'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: read
    env:
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      AI_PROVIDER: ${{ vars.AI_CLI || 'claude' }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install provider CLI
        uses: ./.github/actions/install-ai-cli
        with:
          ai_cli: ${{ vars.AI_CLI || 'claude' }}
      - name: Compute metadata
        id: meta
        run: |
          python .github/scripts/harness.py \
            --mode meta \
            --issue-title "$ISSUE_TITLE" \
            --issue-number "$ISSUE_NUMBER"

      - name: Create proposal branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.meta.outputs.branch }}"
          mkdir -p "changes/${{ steps.meta.outputs.slug }}"

      - name: Run explore/propose harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/harness.py \
            --mode run \
            --provider "$AI_PROVIDER" \
            --issue-title "$ISSUE_TITLE" \
            --issue-number "$ISSUE_NUMBER" \
            --issue-body "$ISSUE_BODY"

      - name: Commit and push proposal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add changes/ explore_output.md 2>/dev/null || git add changes/
          git diff --staged --quiet || git commit -m "proposal: issue #$ISSUE_NUMBER - $ISSUE_TITLE"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push --set-upstream origin "${{ steps.meta.outputs.branch }}"

      - name: Open proposal PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "proposal: $ISSUE_TITLE" \
            --body "Closes #$ISSUE_NUMBER\n\nReview generated files under changes/${{ steps.meta.outputs.slug }}." \
            --base main \
            --head "${{ steps.meta.outputs.branch }}"
