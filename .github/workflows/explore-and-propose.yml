name: Explore and Propose

on:
  issues:
    types: [labeled]
  
jobs:
  generate-proposal:
    env:
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    if: github.event.label.name == 'feature'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute slug and branch name
        id: meta
        run: |
          TITLE="$ISSUE_TITLE"
          SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-50)
          BRANCH="proposal/issue-$ISSUE_NUMBER-${SLUG}"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create proposal branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.meta.outputs.branch }}"
          mkdir -p "changes/${{ steps.meta.outputs.slug }}"

      # ── Claude path: use the official claude-code-action ──────────────────
      - name: Explore and Propose (Claude)
        if: vars.AI_CLI == '' || vars.AI_CLI == 'claude'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are running in an automated GitHub Actions workflow.

            Issue #$ISSUE_NUMBER: $ISSUE_TITLE

            Issue body:
            $ISSUE_BODY

            Please do the following two steps:

            Step 1 — Explore:
            Run /opsx:explore "$ISSUE_TITLE: $ISSUE_BODY"
            and write the architectural research output to `explore_output.md`.

            Step 2 — Propose:
            Run /opsx:propose "$ISSUE_TITLE"
            and write:
            - The proposal (architectural options + recommended approach) to `changes/${{ steps.meta.outputs.slug }}/proposal.md`
            - The ordered implementation task list to `changes/${{ steps.meta.outputs.slug }}/tasks.md`

            If the skills are not available, write reasonable placeholder content to those files
            so the PR can still be reviewed by a human.

      # ── Codex / OpenCode path: manual CLI install ─────────────────────────
      - name: Setup Node (Codex/OpenCode)
        if: vars.AI_CLI != '' && vars.AI_CLI != 'claude'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AI CLI (Codex/OpenCode)
        if: vars.AI_CLI != '' && vars.AI_CLI != 'claude'
        id: cli
        uses: ./.github/actions/install-ai-cli

      - name: Explore (Codex/OpenCode)
        if: vars.AI_CLI != '' && vars.AI_CLI != 'claude'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          ${{ steps.cli.outputs.cmd }} "/opsx:explore \"$ISSUE_TITLE: $ISSUE_BODY\"" > explore_output.md 2>&1 || true

      - name: Propose (Codex/OpenCode)
        if: vars.AI_CLI != '' && vars.AI_CLI != 'claude'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          SLUG="${{ steps.meta.outputs.slug }}"
          ${{ steps.cli.outputs.cmd }} "/opsx:propose \"$ISSUE_TITLE\"" > propose_output.md 2>&1 || true
          [ ! -f "changes/${SLUG}/proposal.md" ] && cp propose_output.md "changes/${SLUG}/proposal.md" || true
          if [ ! -f "changes/${SLUG}/tasks.md" ]; then
            echo "# Tasks: $ISSUE_TITLE" > "changes/${SLUG}/tasks.md"
            cat explore_output.md >> "changes/${SLUG}/tasks.md"
          fi

      # ── Commit and open PR (always) ────────────────────────────────────────
      - name: Commit and push proposal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add changes/ explore_output.md 2>/dev/null || git add changes/
          git diff --staged --quiet || git commit -m "proposal: issue #$ISSUE_NUMBER - $ISSUE_TITLE"
          git push origin "${{ steps.meta.outputs.branch }}"

      - name: Open proposal PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "proposal: $ISSUE_TITLE" \
            --body "$(cat <<'EOF'
          ## Proposal for Issue #$ISSUE_NUMBER

          Closes #$ISSUE_NUMBER

          ### Review Checklist
          - [ ] Read `changes/${{ steps.meta.outputs.slug }}/proposal.md` — architectural options and recommended approach
          - [ ] Read `changes/${{ steps.meta.outputs.slug }}/tasks.md` — ordered implementation task list

          **IMPORTANT:** Review both files before approving. Merging this PR triggers the implementation workflow.

          _Generated using `${{ vars.AI_CLI || 'claude' }}` via the opsx pipeline._
          EOF
          )" \
            --base main \
            --head "${{ steps.meta.outputs.branch }}"
