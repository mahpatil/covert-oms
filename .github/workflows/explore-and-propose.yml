name: Explore and Propose

on:
  issues:
    types: [labeled]

jobs:
  generate-proposal:
    if: github.event.label.name == 'feature'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AI CLI
        id: cli
        uses: ./.github/actions/install-ai-cli
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: Compute slug and branch name
        id: meta
        run: |
          TITLE="${{ github.event.issue.title }}"
          SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-50)
          BRANCH="proposal/issue-${{ github.event.issue.number }}-${SLUG}"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create proposal branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.meta.outputs.branch }}"

      - name: Run opsx explore
        id: explore
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          ${{ steps.cli.outputs.cmd }} "/opsx:explore \"${ISSUE_TITLE}: ${ISSUE_BODY}\"" > explore_output.md 2>&1 || true
          echo "Explore output:"
          cat explore_output.md

      - name: Run opsx propose
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          SLUG="${{ steps.meta.outputs.slug }}"
          mkdir -p "changes/${SLUG}"
          ${{ steps.cli.outputs.cmd }} "/opsx:propose \"${{ github.event.issue.title }}\"" > propose_output.md 2>&1 || true

          # If the skill wrote the files directly, they're already in place.
          # If not, use the CLI output as the proposal.
          if [ ! -f "changes/${SLUG}/proposal.md" ]; then
            cp propose_output.md "changes/${SLUG}/proposal.md"
          fi
          if [ ! -f "changes/${SLUG}/tasks.md" ]; then
            # Generate a minimal tasks.md from the explore output as fallback
            echo "# Tasks for: ${{ github.event.issue.title }}" > "changes/${SLUG}/tasks.md"
            echo "" >> "changes/${SLUG}/tasks.md"
            echo "_Generated from issue #${{ github.event.issue.number }}_" >> "changes/${SLUG}/tasks.md"
            echo "" >> "changes/${SLUG}/tasks.md"
            cat explore_output.md >> "changes/${SLUG}/tasks.md"
          fi

      - name: Commit and push proposal
        run: |
          git add changes/
          git commit -m "proposal: add proposal for issue #${{ github.event.issue.number }} - ${{ github.event.issue.title }}"
          git push origin "${{ steps.meta.outputs.branch }}"

      - name: Open proposal PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "proposal: ${{ github.event.issue.title }}" \
            --body "$(cat <<'EOF'
          ## Proposal for Issue #${{ github.event.issue.number }}

          Closes #${{ github.event.issue.number }}

          ### Review Checklist
          - [ ] Read `changes/${{ steps.meta.outputs.slug }}/proposal.md` — architectural options and recommended approach
          - [ ] Read `changes/${{ steps.meta.outputs.slug }}/tasks.md` — ordered implementation task list

          **IMPORTANT:** Review both files before approving. Merging this PR will automatically trigger the implementation workflow.

          _Generated by the opsx explore-and-propose workflow using `${{ vars.AI_CLI || 'claude' }}` CLI._
          EOF
          )" \
            --base main \
            --head "${{ steps.meta.outputs.branch }}"
