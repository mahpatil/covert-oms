name: Install AI CLI
description: Install Claude Code, Codex, or OpenCode CLI based on the AI_CLI repo variable

outputs:
  cmd:
    description: The CLI command to invoke skills (e.g. "claude --print")
    value: ${{ steps.set-cmd.outputs.cmd }}

runs:
  using: composite
  steps:
    - name: Install CLI
      shell: bash
      run: |
        CLI="${{ vars.AI_CLI || 'claude' }}"
        echo "Installing AI CLI: $CLI"
        case "$CLI" in
          claude)
            npm install -g @anthropic-ai/claude-code
            ;;
          codex)
            npm install -g @openai/codex
            ;;
          opencode)
            npm install -g opencode
            ;;
          *)
            echo "Unknown AI_CLI value '$CLI', defaulting to claude"
            npm install -g @anthropic-ai/claude-code
            ;;
        esac

    - name: Set CLI command output
      id: set-cmd
      shell: bash
      run: |
        CLI="${{ vars.AI_CLI || 'claude' }}"
        case "$CLI" in
          claude)   echo "cmd=claude --print" >> "$GITHUB_OUTPUT" ;;
          codex)    echo "cmd=codex --full-auto" >> "$GITHUB_OUTPUT" ;;
          opencode) echo "cmd=opencode run" >> "$GITHUB_OUTPUT" ;;
          *)        echo "cmd=claude --print" >> "$GITHUB_OUTPUT" ;;
        esac
