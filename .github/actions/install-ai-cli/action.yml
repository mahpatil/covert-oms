name: Install AI CLI (Codex / OpenCode)
description: |
  Install Codex or OpenCode CLI and return the invocation command.
  For Claude, use anthropics/claude-code-action@v1 directly instead.

outputs:
  cmd:
    description: The CLI command prefix (e.g. "codex --full-auto")
    value: ${{ steps.set-cmd.outputs.cmd }}

runs:
  using: composite
  steps:
    - name: Install CLI
      shell: bash
      run: |
        CLI="${{ vars.AI_CLI }}"
        echo "Installing AI CLI: $CLI"
        case "$CLI" in
          codex)
            npm install -g @openai/codex
            ;;
          opencode)
            npm install -g opencode
            ;;
          *)
            echo "Warning: install-ai-cli action called for '$CLI'. For Claude, use anthropics/claude-code-action@v1 instead."
            ;;
        esac

    - name: Set CLI command output
      id: set-cmd
      shell: bash
      run: |
        case "${{ vars.AI_CLI }}" in
          codex)    echo "cmd=codex --full-auto" >> "$GITHUB_OUTPUT" ;;
          opencode) echo "cmd=opencode run" >> "$GITHUB_OUTPUT" ;;
          *)        echo "cmd=echo 'No CLI configured'" >> "$GITHUB_OUTPUT" ;;
        esac
