name: Install AI CLI

description: Install selected AI CLI and return invocation command.

outputs:
  cmd:
    description: The CLI command prefix.
    value: ${{ steps.set-cmd.outputs.cmd }}

runs:
  using: composite
  steps:
    - name: Install CLI
      shell: bash
      run: |
        CLI="${{ vars.AI_CLI || 'claude' }}"
        echo "Installing AI CLI: $CLI"
        case "$CLI" in
          codex)
            npm install -g --ignore-scripts @openai/codex@0.128.0
            ;;
          opencode)
            npm install -g --ignore-scripts opencode-ai@1.14.33
            ;;
          gemini)
            npm install -g --ignore-scripts @google/gemini-cli
            ;;
          claude)
            npm install -g --ignore-scripts @anthropic-ai/claude-code
            ;;
          dummy)
            echo "Dummy provider selected; skipping CLI install."
            ;;
          *)
            echo "Unsupported AI_CLI: $CLI" >&2
            exit 1
            ;;
        esac

    - name: Set CLI command output
      id: set-cmd
      shell: bash
      run: |
        case "${{ vars.AI_CLI || 'claude' }}" in
          codex)    echo "cmd=codex exec" >> "$GITHUB_OUTPUT" ;;
          opencode) echo "cmd=opencode run" >> "$GITHUB_OUTPUT" ;;
          gemini)   echo "cmd=gemini -p" >> "$GITHUB_OUTPUT" ;;
          claude)   echo "cmd=claude -p" >> "$GITHUB_OUTPUT" ;;
          dummy)    echo "cmd=python -c print(\"dummy provider output\")" >> "$GITHUB_OUTPUT" ;;
        esac
